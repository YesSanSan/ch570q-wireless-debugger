# Ordinary OpenOCD CMSIS-DAP HID, firmware 1.3.1 or newer on RF slave.
# No TCP proxy, reduced packet size or custom OpenOCD build is required.
source [file normalize [file join [file dirname [info script]] ../../config/openocd-probe.cfg]]
source [find target/stm32f1x.cfg]
adapter speed 100
reset_config none
cortex_m reset_config sysresetreq
