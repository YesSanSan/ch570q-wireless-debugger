# CMSIS-DAP v2 Bulk on interface 1 of the composite wireless debugger.
# Add the ARM target .cfg separately; set speed AFTER target configuration.
adapter driver cmsis-dap
cmsis-dap backend usb_bulk
adapter usb vid_pid 0x1209 0x0001
transport select swd
adapter speed 100
reset_config none
# For Cortex-M targets, after loading the target .cfg use:
#   -c "cortex_m reset_config sysresetreq"
# This requests target software reset through SWD; no external NRST is used.
